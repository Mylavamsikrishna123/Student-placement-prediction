<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard | Placement Predictor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.card { border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.skill-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: end; }
.skill-name-input { flex: 2; }
.skill-level-select { flex: 1; }
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid">
    <a class="navbar-brand" href="index.html">Admin Dashboard</a>
    <a href="admin_login.html" class="btn btn-outline-light">Logout</a>
</div>
</nav>

<div class="container mt-4">
    <div class="card p-4 mb-4">
        <h4>Add Company</h4>
        <form id="companyForm">
            <div class="mb-3">
                <label>Company Name</label>
                <input type="text" id="companyName" class="form-control" placeholder="Enter Company Name" required>
            </div>
            <div class="mb-3">
                <label>Application Link</label>
                <input type="url" id="companyLink" class="form-control" placeholder="Enter link to apply" required>
            </div>
            <div class="mb-3">
                <label>Required CGPA</label>
                <input type="number" id="companyCgpa" class="form-control" placeholder="Enter required CGPA" step="0.01" min="0" max="10" required>
            </div>
            <div class="mb-3">
                <label>Required Skills (Select Skill Name and Level)</label>
                <div id="skillsContainer">
                    <div class="skill-row">
                        <input type="text" placeholder="Skill Name (e.g., Java, Python)" class="skill-name form-control skill-name-input">
                        <select class="skill-level form-control skill-level-select">
                            <option value="">Select Level</option>
                            <option value="1">Beginner ⭐</option>
                            <option value="2">Medium ⭐⭐</option>
                            <option value="3">Advanced ⭐⭐⭐</option>
                        </select>
                        <button type="button" class="btn btn-sm btn-danger remove-skill" style="display:none;">Remove</button>
                    </div>
                </div>
                <button type="button" class="btn btn-secondary mb-2" id="addSkill">Add More Skill</button>
            </div>
            <button type="submit" class="btn btn-custom w-100">Save Company</button>
        </form>
    </div>

    <div class="card p-4">
        <h4>Companies List</h4>
        <div class="alert alert-info">
            <strong>Matching Rules:</strong><br>
            • If student CGPA ≥ 9.0: Show all companies<br>
            • If student CGPA ≥ 7.0: Show companies where student meets all required skill levels
        </div>
        <ul class="list-group" id="companyList"></ul>
    </div>
</div>

<!-- Edit Company Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Company</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editCompanyForm">
                    <input type="hidden" id="editCompanyId">
                    <div class="mb-3">
                        <label>Company Name</label>
                        <input type="text" id="editCompanyName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Application Link</label>
                        <input type="url" id="editCompanyLink" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Required CGPA</label>
                        <input type="number" id="editCompanyCgpa" class="form-control" step="0.01" min="0" max="10" required>
                    </div>
                    <div class="mb-3">
                        <label>Required Skills</label>
                        <div id="editSkillsContainer">
                            <div class="skill-row">
                                <input type="text" placeholder="Skill Name" class="skill-name form-control skill-name-input">
                                <select class="skill-level form-control skill-level-select">
                                    <option value="">Select Level</option>
                                    <option value="1">Beginner ⭐</option>
                                    <option value="2">Medium ⭐⭐</option>
                                    <option value="3">Advanced ⭐⭐⭐</option>
                                </select>
                                <button type="button" class="btn btn-sm btn-danger remove-skill" style="display:none;">Remove</button>
                            </div>
                        </div>
                        <button type="button" class="btn btn-secondary mb-2" id="editAddSkill">Add More Skill</button>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-custom" id="saveEditBtn">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let editModal;
document.addEventListener('DOMContentLoaded', function() {
    editModal = new bootstrap.Modal(document.getElementById('editModal'));
});

document.getElementById('addSkill').addEventListener('click', function() {
    const container = document.getElementById('skillsContainer');
    const div = document.createElement('div');
    div.className = 'skill-row';
    div.innerHTML = `
        <input type="text" placeholder="Skill Name (e.g., Java, Python)" class="skill-name form-control skill-name-input">
        <select class="skill-level form-control skill-level-select">
            <option value="">Select Level</option>
            <option value="1">Beginner ⭐</option>
            <option value="2">Medium ⭐⭐</option>
            <option value="3">Advanced ⭐⭐⭐</option>
        </select>
        <button type="button" class="btn btn-sm btn-danger remove-skill">Remove</button>
    `;
    container.appendChild(div);
    
    // Add remove functionality
    div.querySelector('.remove-skill').addEventListener('click', function() {
        div.remove();
    });
});

// Show remove button for first skill row if there are multiple
document.getElementById('skillsContainer').addEventListener('input', function() {
    const rows = this.querySelectorAll('.skill-row');
    rows.forEach((row, idx) => {
        const removeBtn = row.querySelector('.remove-skill');
        if (rows.length > 1) {
            removeBtn.style.display = 'block';
        } else {
            removeBtn.style.display = 'none';
        }
    });
});

document.getElementById('companyForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const name = document.getElementById('companyName').value;
    const link = document.getElementById('companyLink').value;
    const cgpa = parseFloat(document.getElementById('companyCgpa').value) || -1;
    
    const skills = {};
    const skillNames = document.querySelectorAll('#skillsContainer .skill-name');
    const skillLevels = document.querySelectorAll('#skillsContainer .skill-level');
    
    skillNames.forEach((sn, i) => {
        const skillName = sn.value.trim();
        const level = skillLevels[i].value;
        if (skillName && level) {
            skills[skillName] = parseInt(level);
        }
    });
    
    if (Object.keys(skills).length === 0) {
        alert('Please add at least one required skill');
        return;
    }
    
    try {
        const resp = await fetch('http://localhost:8080/api/companies', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, link, requiredCgpa: isFinite(cgpa) && cgpa >= 0 ? cgpa : null, skills })
        });
        const data = await resp.json();
        if (!resp.ok) {
            alert(data.error || 'Failed to save company');
            return;
        }
        alert('Company saved successfully!');
        await loadCompanies();
        this.reset();
        // Reset skills container to one row
        document.getElementById('skillsContainer').innerHTML = `
            <div class="skill-row">
                <input type="text" placeholder="Skill Name (e.g., Java, Python)" class="skill-name form-control skill-name-input">
                <select class="skill-level form-control skill-level-select">
                    <option value="">Select Level</option>
                    <option value="1">Beginner ⭐</option>
                    <option value="2">Medium ⭐⭐</option>
                    <option value="3">Advanced ⭐⭐⭐</option>
                </select>
                <button type="button" class="btn btn-sm btn-danger remove-skill" style="display:none;">Remove</button>
            </div>
        `;
    } catch (err) {
        alert('Error saving company: ' + err.message);
    }
});

async function editCompany(company) {
    document.getElementById('editCompanyId').value = company.id;
    document.getElementById('editCompanyName').value = company.name;
    document.getElementById('editCompanyLink').value = company.link;
    document.getElementById('editCompanyCgpa').value = company.requiredCgpa != null ? company.requiredCgpa : '';
    
    const skillsContainer = document.getElementById('editSkillsContainer');
    skillsContainer.innerHTML = '';
    
    if (company.skills) {
        const skillMatches = company.skills.match(/(\w+)\((\d+)★?\)/g) || [];
        skillMatches.forEach((match, idx) => {
            const skillMatch = match.match(/(\w+)\((\d+)/);
            if (skillMatch) {
                const skillName = skillMatch[1];
                const skillLevel = skillMatch[2];
                
                const div = document.createElement('div');
                div.className = 'skill-row';
                div.innerHTML = `
                    <input type="text" placeholder="Skill Name" class="skill-name form-control skill-name-input" value="${skillName}">
                    <select class="skill-level form-control skill-level-select">
                        <option value="">Select Level</option>
                        <option value="1" ${skillLevel === '1' ? 'selected' : ''}>Beginner ⭐</option>
                        <option value="2" ${skillLevel === '2' ? 'selected' : ''}>Medium ⭐⭐</option>
                        <option value="3" ${skillLevel === '3' ? 'selected' : ''}>Advanced ⭐⭐⭐</option>
                    </select>
                    <button type="button" class="btn btn-sm btn-danger remove-skill" ${skillMatches.length > 1 ? '' : 'style="display:none;"'}>Remove</button>
                `;
                skillsContainer.appendChild(div);
                
                div.querySelector('.remove-skill').addEventListener('click', function() {
                    div.remove();
                });
            }
        });
    }
    
    if (skillsContainer.children.length === 0) {
        skillsContainer.innerHTML = `
            <div class="skill-row">
                <input type="text" placeholder="Skill Name" class="skill-name form-control skill-name-input">
                <select class="skill-level form-control skill-level-select">
                    <option value="">Select Level</option>
                    <option value="1">Beginner ⭐</option>
                    <option value="2">Medium ⭐⭐</option>
                    <option value="3">Advanced ⭐⭐⭐</option>
                </select>
                <button type="button" class="btn btn-sm btn-danger remove-skill" style="display:none;">Remove</button>
            </div>
        `;
    }
    
    editModal.show();
}

async function deleteCompany(companyId) {
    if (!confirm('Are you sure you want to delete this company?')) return;
    
    try {
        const resp = await fetch(`http://localhost:8080/api/companies/${companyId}`, {
            method: 'DELETE',
            headers: {'Content-Type': 'application/json'}
        });
        const data = await resp.json();
        if (!resp.ok) {
            alert(data.error || 'Failed to delete company');
            return;
        }
        alert('Company deleted successfully!');
        await loadCompanies();
    } catch (err) {
        alert('Error deleting company: ' + err.message);
    }
}

async function loadCompanies(){
    const list = document.getElementById('companyList');
    list.innerHTML = '<li class="list-group-item">Loading...</li>';
    try {
        const resp = await fetch('http://localhost:8080/api/companies');
        if (!resp.ok) throw new Error('Failed to load');
        const companies = await resp.json();
        
        list.innerHTML = '';
        if (companies.length === 0) {
            list.innerHTML = '<li class="list-group-item">No companies added yet.</li>';
            return;
        }
        
        companies.forEach((c) => {
            const li = document.createElement('li');
            li.className = "list-group-item";
            const skillsText = c.skills ? c.skills : 'No skills specified';
            li.innerHTML = `
                <strong>${c.name}</strong><br>
                <strong>Required Skills:</strong> ${skillsText}<br>
                <a href="${c.link}" target="_blank" class="btn btn-sm btn-primary mt-2">Application Link</a>
                <button onclick='editCompany(${JSON.stringify(c).replace(/'/g, "&apos;")})' class="btn btn-sm btn-warning mt-2">Edit</button>
                <button onclick='deleteCompany(${c.id})' class="btn btn-sm btn-danger mt-2">Delete</button>
            `;
            list.appendChild(li);
        });
    } catch (e) {
        list.innerHTML = '<li class="list-group-item text-danger">Error loading companies</li>';
    }
}

// Initial load
loadCompanies();

// Save edit
document.getElementById('saveEditBtn').addEventListener('click', async function() {
    const companyId = document.getElementById('editCompanyId').value;
    const name = document.getElementById('editCompanyName').value;
    const link = document.getElementById('editCompanyLink').value;
    const cgpa = parseFloat(document.getElementById('editCompanyCgpa').value) || -1;
    
    const skills = {};
    const skillNames = document.querySelectorAll('#editSkillsContainer .skill-name');
    const skillLevels = document.querySelectorAll('#editSkillsContainer .skill-level');
    
    skillNames.forEach((sn, i) => {
        const skillName = sn.value.trim();
        const level = skillLevels[i].value;
        if (skillName && level) {
            skills[skillName] = parseInt(level);
        }
    });
    
    if (Object.keys(skills).length === 0) {
        alert('Please add at least one required skill');
        return;
    }
    
    try {
        const resp = await fetch(`http://localhost:8080/api/companies/${companyId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, link, requiredCgpa: isFinite(cgpa) && cgpa >= 0 ? cgpa : null, skills })
        });
        const data = await resp.json();
        if (!resp.ok) {
            alert(data.error || 'Failed to update company');
            return;
        }
        alert('Company updated successfully!');
        editModal.hide();
        await loadCompanies();
    } catch (err) {
        alert('Error updating company: ' + err.message);
    }
});

// Add edit skill handlers
document.getElementById('editAddSkill').addEventListener('click', function() {
    const container = document.getElementById('editSkillsContainer');
    const div = document.createElement('div');
    div.className = 'skill-row';
    div.innerHTML = `
        <input type="text" placeholder="Skill Name" class="skill-name form-control skill-name-input">
        <select class="skill-level form-control skill-level-select">
            <option value="">Select Level</option>
            <option value="1">Beginner ⭐</option>
            <option value="2">Medium ⭐⭐</option>
            <option value="3">Advanced ⭐⭐⭐</option>
        </select>
        <button type="button" class="btn btn-sm btn-danger remove-skill">Remove</button>
    `;
    container.appendChild(div);
    
    div.querySelector('.remove-skill').addEventListener('click', function() {
        div.remove();
    });
});
</script>
</body>
</html>
