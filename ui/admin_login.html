<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login | Placement Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Student Placement Prediction</a>
  </div>
</nav>

<div class="container mt-5 d-flex justify-content-center">
  <div class="card p-4" style="width: 400px;">
    <h4 class="text-center mb-4">Admin Login</h4>
    <form id="adminLoginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="adminEmail" class="form-control" placeholder="Enter email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="adminPassword" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-custom w-100">Login</button>
      <!-- Admin credentials are securely stored in database - not displayed here -->
    </form>
  </div>
</div>
</body>
<script>
document.getElementById('adminLoginForm').addEventListener('submit', async function (event) {
  event.preventDefault();
  const email = document.getElementById('adminEmail').value;
  const password = document.getElementById('adminPassword').value;
  try {
    const resp = await fetch('http://localhost:8080/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email, password, role: 'admin' })
    });
    const data = await resp.json();
    if (!resp.ok) {
      alert(data.error || 'Invalid credentials');
      return;
    }
    window.location.href = 'admin_dashboard.html';
  } catch (e) {
    alert('Login failed: ' + e.message);
  }
});
</script>
</html>
