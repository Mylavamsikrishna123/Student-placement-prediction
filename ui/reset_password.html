<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
<style>
    body {
        background: linear-gradient(135deg, #4e73df, #1cc88a);
        min-height: 100vh;
    }
    .reset-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        max-width: 450px;
        margin: 80px auto;
        padding: 40px;
    }
    .reset-icon {
        width: 70px;
        height: 70px;
        background: linear-gradient(135deg, #4e73df, #1cc88a);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 32px;
        color: white;
    }
    .btn-custom {
        background-color: #4e73df;
        border: none;
        height: 50px;
        border-radius: 10px;
    }
    .btn-custom:hover {
        background-color: #2e59d9;
        transform: translateY(-2px);
    }
    .password-strength {
        height: 5px;
        border-radius: 3px;
        margin-top: 5px;
        transition: all 0.3s;
    }
    .password-match {
        font-size: 12px;
        margin-top: 5px;
    }
</style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Student Placement Prediction</a>
  </div>
</nav>

<div class="container">
    <div class="reset-card">
        <div class="text-center">
            <div class="reset-icon">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h3>Reset Password</h3>
            <p class="text-muted">Enter your reset code and new password</p>
        </div>

        <form id="resetPasswordForm">
            <div class="mb-3">
                <label class="form-label">Reset Code</label>
                <input type="text" id="resetToken" class="form-control" 
                       placeholder="Paste your reset code here" required>
                <small class="text-muted">Enter the code you received</small>
            </div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" id="newPassword" class="form-control" 
                       placeholder="Enter new password (min 8 characters)" required>
                <div id="passwordStrength" class="password-strength"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" 
                       placeholder="Re-enter new password" required>
                <div id="passwordMatch" class="password-match"></div>
            </div>

            <button type="submit" class="btn btn-custom w-100 text-white">
                <i class="bi bi-check-circle me-2"></i>Reset Password
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="user_login.html" class="text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Back to Login
            </a>
        </div>
    </div>
</div>

<script>
// Password strength indicator
document.getElementById('newPassword').addEventListener('input', function() {
    const password = this.value;
    const strengthBar = document.getElementById('passwordStrength');
    
    if (password.length === 0) {
        strengthBar.style.width = '0%';
    } else if (password.length < 8) {
        strengthBar.style.width = '33%';
        strengthBar.style.background = '#dc3545';
    } else if (password.length < 12) {
        strengthBar.style.width = '66%';
        strengthBar.style.background = '#ffc107';
    } else {
        strengthBar.style.width = '100%';
        strengthBar.style.background = '#28a745';
    }
    
    checkPasswordMatch();
});

// Password match checker
document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);

function checkPasswordMatch() {
    const password = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    const matchDiv = document.getElementById('passwordMatch');
    
    if (confirm.length === 0) {
        matchDiv.textContent = '';
        return;
    }
    
    if (password === confirm) {
        matchDiv.textContent = '✓ Passwords match';
        matchDiv.style.color = '#28a745';
    } else {
        matchDiv.textContent = '✗ Passwords do not match';
        matchDiv.style.color = '#dc3545';
    }
}

document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const token = document.getElementById('resetToken').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    // Validate passwords match
    if (newPassword !== confirmPassword) {
        alert('Passwords do not match!');
        return;
    }
    
    // Validate password length
    if (newPassword.length < 8) {
        alert('Password must be at least 8 characters long!');
        return;
    }
    
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Resetting...';
    
    try {
        const response = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                token: token, 
                newPassword: newPassword 
            })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
            alert(data.error || 'Failed to reset password.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Reset Password';
            return;
        }
        
        // Success!
        alert('✓ Password reset successful! You can now login with your new password.');
        sessionStorage.removeItem('resetEmail');
        window.location.href = 'user_login.html';
        
    } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please check if the server is running.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Reset Password';
    }
});
</script>

</body>
</html>
