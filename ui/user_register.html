<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Student Placement Prediction</a>
  </div>
</nav>

<div class="container mt-5 d-flex justify-content-center">
  <div class="card p-4" style="width: 400px;">
    <h4 class="text-center mb-4">Student Registration</h4>
    <form id="studentRegisterForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="regEmail" class="form-control" placeholder="Enter email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="regPassword" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-custom w-100">Register</button>
      <p class="text-center mt-3">Already a user? <a href="user_login.html">Login</a></p>
    </form>
  </div>
</div>

<script>
// Create a student account with email + password.
// The rest of the profile is filled in later on the dashboard.
document.getElementById('studentRegisterForm').addEventListener('submit', async function (event) {
  event.preventDefault();
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  
  try {
    const response = await fetch('/api/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email: email, password: password })
    });
    
    const data = await response.json();
    
    if (!response.ok) {
      alert(data.error || 'Registration failed');
      return;
    }
    
    alert('Registration successful! Please login.');
    window.location.href = 'user_login.html';
  } catch (error) {
    alert('Registration failed: ' + error.message);
  }
});
</script>
</body>
</html>
