<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
<style>
    body {
        background: linear-gradient(135deg, #4e73df, #1cc88a);
        min-height: 100vh;
    }
    .forgot-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        max-width: 450px;
        margin: 80px auto;
        padding: 40px;
    }
    .forgot-icon {
        width: 70px;
        height: 70px;
        background: linear-gradient(135deg, #4e73df, #1cc88a);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 32px;
        color: white;
    }
    .token-display {
        background: #f8f9fa;
        border: 2px dashed #667eea;
        border-radius: 10px;
        padding: 20px;
        margin-top: 20px;
        text-align: center;
    }
    .token-code {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        font-weight: bold;
        color: #667eea;
        word-break: break-all;
        user-select: all;
        padding: 10px;
        background: white;
        border-radius: 6px;
    }
    .btn-custom {
        background-color: #4e73df;
        border: none;
        height: 50px;
        border-radius: 10px;
    }
    .btn-custom:hover {
        background-color: #2e59d9;
        transform: translateY(-2px);
    }
</style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Student Placement Prediction</a>
  </div>
</nav>

<div class="container">
    <div class="forgot-card">
        <div class="text-center">
            <div class="forgot-icon">
                <i class="bi bi-key"></i>
            </div>
            <h3>Forgot Password?</h3>
            <p class="text-muted">Enter your email to receive a reset code</p>
        </div>

        <div id="emailStep">
            <form id="forgotPasswordForm">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="resetEmail" class="form-control" 
                           placeholder="Enter your registered email" required>
                </div>
                <button type="submit" class="btn btn-custom w-100 text-white">
                    <i class="bi bi-send me-2"></i>Send Reset Code
                </button>
            </form>
        </div>

        <div id="tokenDisplay" style="display: none;">
            <div class="alert alert-success">
                <i class="bi bi-check-circle me-2"></i>
                <strong>Reset Code Generated!</strong>
                <p class="mb-0 mt-2 small">Copy the code below and use it to reset your password. <strong>Valid for 1 hour.</strong></p>
            </div>
            <div class="token-display">
                <div class="token-code" id="generatedToken">------</div>
                <button class="btn btn-sm btn-outline-primary mt-2" type="button" onclick="selectToken()">
                    <i class="bi bi-clipboard me-1"></i>Copy
                </button>
            </div>
            <div class="mt-3">
                <a href="reset_password.html" class="btn btn-custom w-100 text-white">
                    <i class="bi bi-arrow-right me-2"></i>Continue to Reset Password
                </a>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="user_login.html" class="text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Back to Login
            </a>
        </div>
    </div>
</div>

<script>
document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const email = document.getElementById('resetEmail').value.trim();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';
    
    try {
        const response = await fetch('http://localhost:8080/api/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
            alert(data.error || 'Failed to generate reset code.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-send me-2"></i>Send Reset Code';
            return;
        }
        
        // Display the token
        if (data.token) {
            document.getElementById('generatedToken').textContent = data.token;
            document.getElementById('emailStep').style.display = 'none';
            document.getElementById('tokenDisplay').style.display = 'block';
        } else {
            alert('Reset code request sent. If the email exists, you will receive the code.');
        }
        
    } catch (error) {
        console.error('Error:', error);
        alert('Network error. Please check if the server is running.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-send me-2"></i>Send Reset Code';
    }
});

function copyToken() {
    const token = document.getElementById('generatedToken').textContent;
    
    // Try modern clipboard API first
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(token).then(() => {
            showCopySuccess();
        }).catch(err => {
            // Fallback to old method
            fallbackCopy(token);
        });
    } else {
        // Use fallback for older browsers
        fallbackCopy(token);
    }
}

function fallbackCopy(text) {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.left = '-999999px';
    textArea.style.top = '-999999px';
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    
    try {
        const successful = document.execCommand('copy');
        if (successful) {
            showCopySuccess();
        } else {
            alert('Copy failed. Please select and copy the code manually:\n\n' + text);
        }
    } catch (err) {
        alert('Copy failed. Please select and copy the code manually:\n\n' + text);
    }
    
    document.body.removeChild(textArea);
}

function showCopySuccess() {
    const btn = event.target.closest('button');
    btn.innerHTML = '<i class="bi bi-check2 me-1"></i>Copied!';
    btn.classList.remove('btn-outline-primary');
    btn.classList.add('btn-success');
    setTimeout(() => {
        btn.innerHTML = '<i class="bi bi-clipboard me-1"></i>Copy Code';
        btn.classList.remove('btn-success');
        btn.classList.add('btn-outline-primary');
    }, 2000);
}

function selectToken() {
    const tokenElement = document.getElementById('generatedToken');
    const range = document.createRange();
    range.selectNodeContents(tokenElement);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    
    // Show instruction
    const btn = event.target.closest('button');
    const originalHTML = btn.innerHTML;
    btn.innerHTML = '<i class="bi bi-check2 me-1"></i>Copied!';
    btn.classList.add('btn-success');
    btn.classList.remove('btn-outline-primary');
    setTimeout(() => {
        btn.innerHTML = originalHTML;
        btn.classList.remove('btn-success');
        btn.classList.add('btn-outline-primary');
    }, 3000);
}
</script>

</body>
</html>
