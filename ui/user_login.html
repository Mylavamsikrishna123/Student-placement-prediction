<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Login | Placement Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Student Placement Prediction</a>
  </div>
</nav>

<div class="container mt-5 d-flex justify-content-center">
  <div class="card p-4" style="width: 400px;">
    <h4 class="text-center mb-4">User Login</h4>
    <form id="studentLoginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="Enter email">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="Enter password">
      </div>
      <button type="submit" class="btn btn-custom w-100">Login</button>
      <p class="text-center mt-3">New student? <a href="user_register.html">Register</a></p>
    </form>
  </div>
</div>
<script>
document.getElementById('studentLoginForm').addEventListener('submit', async function (event) {
  event.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  try {
    const resp = await fetch('http://localhost:8080/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email, password, role: 'student' })
    });
    const data = await resp.json();
    if (!resp.ok) {
      alert(data.error || 'Invalid credentials');
      return;
    }
    // Store email in sessionStorage for profile
    sessionStorage.setItem('studentEmail', email);
    window.location.href = 'student_dashboard.html';
  } catch (e) {
    alert('Login failed');
  }
});
</script>
</body>
</html>
