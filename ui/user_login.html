<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Student Placement Prediction</a>
  </div>
</nav>

<div class="container mt-5 d-flex justify-content-center">
  <div class="card p-4" style="width: 400px;">
    <h4 class="text-center mb-4">Student Login</h4>
    <form id="studentLoginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="Enter email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-custom w-100">Login</button>
      <p class="text-center mt-3">New student? <a href="user_register.html">Register</a></p>
    </form>
  </div>
</div>

<script>
document.getElementById('studentLoginForm').addEventListener('submit', async function (event) {
  event.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  
  try {
    const apiUrl = 'http://127.0.0.1:8080/api/login';
    console.log('Attempting login to:', apiUrl);
    
    const response = await fetch(apiUrl, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email: email, password: password, role: 'student' }),
      mode: 'cors',
      credentials: 'omit'
    });
    
    console.log('Response status:', response.status);
    const data = await response.json();
    console.log('Response data:', data);
    
    if (!response.ok) {
      alert(data.error || 'Invalid credentials');
      return;
    }
    
    // Save email for later use
    sessionStorage.setItem('studentEmail', email);
    window.location.href = 'student_dashboard.html';
  } catch (error) {
    console.error('Login error:', error);
    alert('Login failed: ' + error.message);
  }
});
</script>
</body>
</html>
