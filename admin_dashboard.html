<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard | Placement Predictor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.card { border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.skill-input { width: 60px; display:inline-block; }
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid">
    <a class="navbar-brand" href="#">Admin Dashboard</a>
    <a href="admin_login.html" class="btn btn-outline-light">Logout</a>
</div>
</nav>

<div class="container mt-4">
    <div class="card p-4 mb-4">
        <h4>Add/Edit Company</h4>
        <form id="companyForm">
            <div class="mb-3">
                <label>Company Name</label>
                <input type="text" id="companyName" class="form-control" placeholder="Enter Company Name" required>
            </div>
            <div class="mb-3">
                <label>Minimum CGPA</label>
                <input type="number" step="0.01" min="0" max="10" id="minCgpa" class="form-control" placeholder="Enter Minimum CGPA" required>
            </div>
            <div class="mb-3">
                <label>Required Skills (Name + Stars 1-5)</label>
                <div class="mb-2">
                    <input type="text" placeholder="Skill Name" class="skill-name form-control mb-1">
                    <input type="number" min="1" max="5" placeholder="Stars" class="skill-stars form-control mb-2">
                </div>
                <button type="button" class="btn btn-secondary mb-2" id="addSkill">Add More Skill</button>
            </div>
            <div class="mb-3">
                <label>Application Link</label>
                <input type="url" id="companyLink" class="form-control" placeholder="Enter link to apply" required>
            </div>
            <button type="submit" class="btn btn-custom w-100">Save Company</button>
        </form>
    </div>

    <div class="card p-4">
        <h4>Companies List</h4>
        <ul class="list-group" id="companyList"></ul>
    </div>
</div>

<script>
let companies = [];

document.getElementById('addSkill').addEventListener('click', function() {
    const div = document.createElement('div');
    div.innerHTML = `
        <input type="text" placeholder="Skill Name" class="skill-name form-control mb-1">
        <input type="number" min="1" max="5" placeholder="Stars" class="skill-stars form-control mb-2">
    `;
    this.parentNode.insertBefore(div, this);
});

document.getElementById('companyForm').addEventListener('submit', function(e){
    e.preventDefault();
    const name = document.getElementById('companyName').value;
    const minCgpa = parseFloat(document.getElementById('minCgpa').value);
    const link = document.getElementById('companyLink').value;
    const skills = [];
    const skillNames = document.querySelectorAll('.skill-name');
    const skillStars = document.querySelectorAll('.skill-stars');
    skillNames.forEach((sn,i) => {
        if(sn.value && skillStars[i].value) {
            skills.push({name: sn.value.trim(), stars: parseInt(skillStars[i].value)});
        }
    });

    companies.push({name, minCgpa, skills, link});
    displayCompanies();
    this.reset();
});

function displayCompanies(){
    const list = document.getElementById('companyList');
    list.innerHTML = '';
    companies.forEach((c,i) => {
        const li = document.createElement('li');
        li.className = "list-group-item";
        li.innerHTML = `<strong>${c.name}</strong> - CGPA>=${c.minCgpa} <br>
        Required Skills: ${c.skills.map(s=>s.name+'('+s.stars+'★)').join(', ')} <br>
        Link: <a href="${c.link}" target="_blank">${c.link}</a>`;
        list.appendChild(li);
    });
}
</script>
</body>
</html>
