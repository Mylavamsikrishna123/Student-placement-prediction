<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard | Placement Predictor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.card { border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-bottom:20px; }
.star-rating { display:flex; gap:5px; cursor:pointer; }
.star { font-size:24px; color:#ccc; }
.star.selected { color: gold; }
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid">
    <a class="navbar-brand" href="#">Student Dashboard</a>
    <a href="user_login.html" class="btn btn-outline-light">Logout</a>
</div>
</nav>

<div class="container mt-4">
    <div class="card p-4">
        <h4>Student Profile</h4>
        <form id="studentForm">
            <div class="mb-3">
                <label>Name</label>
                <input type="text" id="name" class="form-control" placeholder="Enter Name">
            </div>
            <div class="mb-3">
                <label>Department</label>
                <input type="text" id="department" class="form-control" placeholder="Enter Department">
            </div>
            <div class="mb-3">
                <label>Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter Email">
            </div>
            <div class="mb-3">
                <label>ID Number</label>
                <input type="text" id="idNumber" class="form-control" placeholder="Enter ID Number">
            </div>
            <div class="mb-3">
                <label>College Name</label>
                <input type="text" id="collegeName" class="form-control" placeholder="Enter College Name">
            </div>
            <div class="mb-3">
                <label>Degree</label>
                <input type="text" id="degree" class="form-control" placeholder="Enter Degree">
            </div>
            <div class="mb-3">
                <label>Phone Number</label>
                <input type="tel" id="phone" class="form-control" placeholder="Enter Phone Number">
            </div>
            <div class="mb-3">
                <label>Overall CGPA</label>
                <input type="number" id="cgpa" min="0" max="10" step="0.01" class="form-control" placeholder="Enter CGPA">
            </div>

            <h5 class="mt-3">Skills</h5>
            <div id="skillsContainer">
                <div class="mb-2">
                    <label>Java</label>
                    <div class="star-rating" data-skill="Java">
                        <span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span>
                    </div>
                </div>
                <div class="mb-2">
                    <label>Python</label>
                    <div class="star-rating" data-skill="Python">
                        <span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span>
                    </div>
                </div>
                <div class="mb-2">
                    <label>C</label>
                    <div class="star-rating" data-skill="C">
                        <span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span>
                    </div>
                </div>
                <div class="mb-2">
                    <label>C++</label>
                    <div class="star-rating" data-skill="C++">
                        <span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span>
                    </div>
                </div>
                <div class="mb-2">
                    <label>HTML</label>
                    <div class="star-rating" data-skill="HTML">
                        <span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span>
                    </div>
                </div>
                <div class="mb-2">
                    <label>ReactJS</label>
                    <div class="star-rating" data-skill="ReactJS">
                        <span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span>
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-custom mt-3" onclick="checkEligibility()">Show Eligible Companies</button>
        </form>
    </div>

    <div class="card p-4 mt-3">
        <h4>Eligible Companies</h4>
        <ul id="eligibleCompanies" class="list-group"></ul>
    </div>
</div>

<script>
// --- Star Rating ---
document.querySelectorAll('.star-rating').forEach(ratingDiv => {
    const stars = ratingDiv.querySelectorAll('.star');
    stars.forEach((star, idx) => {
        star.addEventListener('click', () => {
            stars.forEach((s,i)=>s.classList.toggle('selected', i<=idx));
        });
    });
});

// --- Example Companies (Admin input can be stored in localStorage or JS array) ---
const companies = [
    {name:"Infosys", minCgpa:7.0, skills:[{name:"Java",stars:4},{name:"Python",stars:3},{name:"SQL",stars:3}], link:"#"},
    {name:"TCS", minCgpa:7.0, skills:[{name:"C",stars:3},{name:"Python",stars:3}], link:"#"},
    {name:"Amazon", minCgpa:0, maxCgpa:9.0, skills:[{name:"Java",stars:5},{name:"Python",stars:5},{name:"SQL",stars:5}], link:"#"},
    {name:"Google", minCgpa:9.0, skills:[{name:"Java",stars:5},{name:"Python",stars:5},{name:"SQL",stars:5},{name:"C",stars:5}], link:"#"},
    {name:"Cursor", minCgpa:8.5, skills:[{name:"Java",stars:5},{name:"Python",stars:5},{name:"SQL",stars:5},{name:"HTML",stars:5},{name:"ReactJS",stars:5}], link:"#"}
];

function checkEligibility(){
    const cgpa = parseFloat(document.getElementById('cgpa').value);
    const skillRatings = {};
    document.querySelectorAll('.star-rating').forEach(div=>{
        const skill = div.dataset.skill;
        const stars = div.querySelectorAll('.star.selected').length;
        skillRatings[skill] = stars;
    });

    const eligible = companies.filter(c=>{
        if(c.minCgpa && cgpa < c.minCgpa) return false;
        if(c.maxCgpa && cgpa > c.maxCgpa) return false;
        for(const s of c.skills){
            if(!skillRatings[s.name] || skillRatings[s.name] < s.stars) return false;
        }
        return true;
    });

    const ul = document.getElementById('eligibleCompanies');
    ul.innerHTML = '';
    if(eligible.length === 0){
        ul.innerHTML = '<li class="list-group-item">No companies eligible</li>';
        return;
    }
    eligible.forEach(c=>{
        const li = document.createElement('li');
        li.className = "list-group-item";
        li.innerHTML = `<strong>${c.name}</strong> - <a href="${c.link}" target="_blank">Apply</a>`;
        ul.appendChild(li);
    });
}
</script>
</body>
</html>
