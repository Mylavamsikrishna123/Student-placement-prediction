<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Register | Placement Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Student Placement Prediction</a>
  </div>
</nav>

<div class="container mt-5 d-flex justify-content-center">
  <div class="card p-4" style="width: 400px;">
    <h4 class="text-center mb-4">Student Registration</h4>
    <form>
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" placeholder="Enter full name">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" placeholder="Enter email">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" placeholder="Enter password">
      </div>
      <button type="submit" class="btn btn-custom w-100">Register</button>
      <p class="text-center mt-3">Already a user? <a href="user_login.html">Login</a></p>
    </form>
  </div>
</div>
</body>
</html>
